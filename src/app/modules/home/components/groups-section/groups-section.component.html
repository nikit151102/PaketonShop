<section class="groups">
  <ng-container >
    <div class="categories-grid">
      <div class="category-container" *ngFor="let category of visibleCategories; let i = index"
           [style.--delay]="i * 0.05 + 's'">
        <div class="category-card" [ngClass]="[category.widthClass]" 
             (click)="onNicheClick(category)">
          
          <div class="card-decoration">
            <div class="decoration-circle circle-1"></div>
            <div class="decoration-circle circle-2"></div>
            <div class="decoration-circle circle-3"></div>
          </div>

          <div class="category-image" *ngIf="category.image">
            <img [src]="category.image" [alt]="category.name" loading="lazy" />
            <div class="image-overlay"></div>
            <div class="image-gradient"></div>
          </div>

          <div class="category-content">
            <div class="content-top">
              <div class="category-badge" *ngIf="category.productCount > 0">
                <span class="badge-count">{{ category.productCount }}</span>
                <span class="badge-text">товаров</span>
              </div>
              <div class="category-arrow">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                  <path d="M5 12H19M19 12L12 5M19 12L12 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
            </div>

            <h3 class="category-title">{{ category.name }}</h3>

            <div class="category-tags" *ngIf="category.subcategories && category.subcategories.length > 0">
              <span class="tag" *ngFor="let subcategory of category.subcategories.slice(0, 3)">
                {{ subcategory.name || subcategory }}
              </span>
              <span class="tag more-tag" *ngIf="category.subcategories.length > 3">
                +{{ category.subcategories.length - 3 }}
              </span>
            </div>

            <p class="category-description" *ngIf="(!category.subcategories || category.subcategories.length === 0) && category.description">
              {{ category.description }}
            </p>
          </div>
        </div>
      </div>

      <div class="category-container" *ngIf="categories.length > 0" [style.--delay]="visibleCategories.length * 0.05 + 's'">
        <div class="category-card other-solutions" [routerLink]="'/niches'">
          <div class="card-decoration">
            <div class="decoration-circle circle-1"></div>
            <div class="decoration-circle circle-2"></div>
            <div class="decoration-circle circle-3"></div>
          </div>
          <div class="category-image">
            <div class="icon-placeholder">
              <svg width="56" height="56" viewBox="0 0 24 24" fill="none">
                <path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <circle cx="20" cy="6" r="2" fill="currentColor"/>
                <circle cx="20" cy="12" r="2" fill="currentColor"/>
                <circle cx="20" cy="18" r="2" fill="currentColor"/>
              </svg>
            </div>
            <div class="image-gradient"></div>
          </div>
          <div class="category-content">
            <div class="content-top">
              <div class="category-badge special">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M13 10V3L4 14h7v7l9-11h-7z"/>
                </svg>
                <span>Все решения</span>
              </div>
              <div class="category-arrow">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                  <path d="M5 12H19M19 12L12 5M19 12L12 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
            </div>
            <h3 class="category-title">Другие готовые решения</h3>
            <p class="category-description">Полный каталог товаров для вашего бизнеса</p>
          </div>
        </div>
      </div>
    </div>

    <div class="toggle-button-container" *ngIf="categories.length > 2 * maxPerRow">
      <button class="toggle-button" (click)="toggleShowAll()">
        <span>{{ showAll ? 'Свернуть' : 'Показать все категории' }}</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" [class.rotated]="showAll">
          <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </ng-container>
</section>
