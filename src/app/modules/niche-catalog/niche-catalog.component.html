<section class="niche-catalog">
  <div class="catalog-header">
    <app-title 
      [title]="'Готовые решения для вашего бизнеса'"
      [description]="'Упаковка, которая уже готова решать задачи вашего бизнеса'">
    </app-title>
    
    <div class="view-toggle" *ngIf="categories.length > 0">
      <button class="toggle-btn" [class.active]="viewMode === 'grid'" (click)="setViewMode('grid')" aria-label="Сетка">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"/>
          <rect x="14" y="3" width="7" height="7"/>
          <rect x="3" y="14" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/>
        </svg>
      </button>
      <button class="toggle-btn" [class.active]="viewMode === 'list'" (click)="setViewMode('list')" aria-label="Список">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="8" y1="6" x2="21" y2="6"/>
          <line x1="8" y1="12" x2="21" y2="12"/>
          <line x1="8" y1="18" x2="21" y2="18"/>
          <line x1="3" y1="6" x2="3.01" y2="6"/>
          <line x1="3" y1="12" x2="3.01" y2="12"/>
          <line x1="3" y1="18" x2="3.01" y2="18"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="catalog-state" *ngIf="isLoading">
    <div class="loader-wrapper">
      <div class="spinner"></div>
      <p>Загружаем готовые решения...</p>
    </div>
  </div>

  <div class="catalog-state" *ngIf="error && !isLoading">
    <div class="error-wrapper">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="1.5">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <circle cx="12" cy="16" r="1" fill="#ef4444"/>
      </svg>
      <p>{{ error }}</p>
      <button class="retry-btn" (click)="loadNicheCategories()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"/>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
        </svg>
        Попробовать снова
      </button>
    </div>
  </div>

  <div class="categories-grid" [class.list-view]="viewMode === 'list'" *ngIf="!isLoading && !error">
    <div class="category-card-wrapper" 
         *ngFor="let category of visibleCategories; trackBy: trackByCategoryId; let i = index"
         [@cardAnimation]>
      
      <div class="category-card" 
           [class.featured]="category.isFeatured"
           [class.has-subcategories]="category.subcategories"
           (click)="onNicheClick(category)">

        <!-- <div class="card-badges">
          <span class="badge badge-new" *ngIf="category.isNew">NEW</span>
          <span class="badge badge-popular" *ngIf="category.isPopular">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
            </svg>
            Популярное
          </span>
        </div> -->

        <div class="card-image">
          <div class="image-overlay"></div>
          <img [src]="category.image" 
               [alt]="category.name"
               loading="lazy"
               (error)="handleImageError($event, category)">
          <div class="image-pattern"></div>
          
          <div class="product-counter">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
              <line x1="3" y1="6" x2="21" y2="6" stroke="currentColor" stroke-width="2"/>
            </svg>
            <span>{{ category.productCount }} товаров</span>
          </div>
        </div>

        <div class="card-content">
          <div class="content-header">
            <h3 class="category-name">{{ category.name }}</h3>
            <!-- <div class="category-stats">
              <span class="stat-item">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                {{ category.views }}
              </span>
            </div> -->
          </div>
          
          <p class="category-description" *ngIf="category.description">
            {{ category.description }}
          </p>
          
          <div class="subcategories-list" *ngIf="category.subcategories && category.subcategories.length > 0">
            <span class="subcategory-chip" 
                  *ngFor="let sub of category.subcategories | slice:0:3"
                  (click)="onSubcategoryClick($event, sub)">
              {{ sub.name }}
            </span>
            <span class="subcategory-more" *ngIf="category.subcategories.length > 3">
              +{{ category.subcategories.length - 3 }}
            </span>
          </div>

          <div class="card-footer">
            <button class="explore-btn">
              <span>Подробнее</span>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="5" y1="12" x2="19" y2="12"/>
                <polyline points="12 5 19 12 12 19"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="card-accent"></div>
        <div class="card-decoration">
          <div class="decoration-circle circle-1"></div>
          <div class="decoration-circle circle-2"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="show-more-container" *ngIf="!showAll && categories.length > visibleCategoriesCount">
    <button class="show-more-btn" (click)="toggleShowAll()">
      <span>Показать ещё {{ categories.length - visibleCategoriesCount }} решений</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    </button>
  </div>
</section>
